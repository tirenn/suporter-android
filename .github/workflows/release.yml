name: "Build and Release Android APK on Tag"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: "android-release"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: "Build & Release APK"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "Grant execute permissions for gradlew"
        run: chmod +x gradlew 2>/dev/null || true

      - name: "Run Unit Tests"
        run: gradle testDebugUnitTest --no-daemon || ./gradlew testDebugUnitTest --no-daemon

      - name: "Build Release APK"
        run: gradle assembleRelease assembleDebug --no-daemon || ./gradlew assembleRelease assembleDebug --no-daemon

      - name: "Find and Rename APKs"
        run: |
          mkdir -p build-apks
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-apks/ \;
          ls -la build-apks/

      - name: "Upload APK Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "suporter-android-apks-${{ github.ref_name }}"
          path: build-apks/*.apk
          retention-days: 30

      - name: "Create GitHub Release with APKs"
        uses: softprops/action-gh-release@v2
        with:
          files: build-apks/*.apk
          name: "Suporter Android Release ${{ github.ref_name }}"
          body: |
            ## 📱 Suporter Android App Release (${{ github.ref_name }})
            
            Download the attached `.apk` file below to install directly on your Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
