name: "Android CI / PR Checks"

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

concurrency:
  group: "android-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Android Unit Tests & Debug Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4

      - name: "Grant execute permissions for gradlew"
        run: chmod +x gradlew 2>/dev/null || true

      - name: "Run Unit Tests"
        run: gradle testDebugUnitTest --no-daemon || ./gradlew testDebugUnitTest --no-daemon

      - name: "Build Debug APK"
        run: gradle assembleDebug --no-daemon || ./gradlew assembleDebug --no-daemon
